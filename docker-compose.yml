
services:
  frontend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: unikorn-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SERVER=http://backend:3001
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "3000:3000"
    volumes:
      - ./fileStorage:/app/fileStorage
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: unikorn-backend
    env_file:
      - .env
    ports:
      - "3001:3001"
